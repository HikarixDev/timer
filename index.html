<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Świątynia Hwang — Timery Bossów</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg-soft: #111111;
    --bg-card: #161616;
    --bg-card-hover: #1c1c1c;
    --border: #262626;
    --border-strong: #3a3a3a;
    --text: #ececec;
    --text-dim: #8a8a8a;
    --text-faint: #555;
    --gold: #c9a961;
    --gold-bright: #e6c688;
    --gold-dim: #5a4d2e;
    --green: #4ade80;
    --green-dim: #1e3a25;
    --amber: #f59e0b;
    --red: #ef4444;
    --red-glow: rgba(239, 68, 68, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(ellipse at top, rgba(201, 169, 97, 0.04), transparent 50%),
      radial-gradient(ellipse at bottom, rgba(74, 222, 128, 0.03), transparent 50%),
      var(--bg);
    padding: 32px 24px 80px;
  }

  /* ── HEADER ───────────────────────────────────────────── */
  header {
    max-width: 1280px;
    margin: 0 auto 48px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .title-group h1 {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(24px, 3vw, 38px);
    letter-spacing: 0.04em;
    color: var(--gold-bright);
    margin-bottom: 6px;
  }

  .title-group .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .conn-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-faint);
    box-shadow: 0 0 0 0 transparent;
    transition: all 0.3s;
  }
  .conn-dot.online { background: var(--green); box-shadow: 0 0 12px var(--green); }
  .conn-dot.error  { background: var(--red);   box-shadow: 0 0 12px var(--red);   }

  .notif-btn {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .notif-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
  .notif-btn.granted { border-color: var(--green-dim); color: var(--green); }

  /* ── BOSS CARDS GRID ─────────────────────────────────── */
  .bosses {
    max-width: 1280px;
    margin: 0 auto 56px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  @media (max-width: 960px) {
    .bosses { grid-template-columns: 1fr; }
  }

  .boss-card {
    background: linear-gradient(180deg, var(--bg-card), var(--bg-soft));
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 24px 24px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  /* Boss image jako atmosferyczne tło karty */
  .boss-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: var(--boss-image);
    background-size: cover;
    background-position: center 20%;
    opacity: 0.18;
    filter: blur(6px) saturate(1.15);
    z-index: 0;
    pointer-events: none;
    transform: scale(1.1); /* rozszerzamy żeby blur nie pokazywał krawędzi */
  }

  /* Color tint overlay */
  .boss-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, transparent 0%, rgba(11, 11, 11, 0.75) 60%, rgba(11, 11, 11, 0.95) 100%),
      linear-gradient(135deg, var(--boss-color, transparent) 0%, transparent 50%);
    background-blend-mode: normal, overlay;
    opacity: 1;
    pointer-events: none;
    z-index: 1;
  }
  .boss-card::after {
    /* drugi gradient z color hint dla mocniejszego klimatu */
  }

  .boss-card > * { position: relative; z-index: 2; }

  .boss-card:hover { border-color: var(--border-strong); }

  .boss-header {
    text-align: center;
    margin-bottom: 24px;
  }

  /* Avatar — okrągłe okno z obrazem bossa */
  .boss-avatar {
    width: 96px;
    height: 96px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background-image: var(--boss-image);
    background-size: cover;
    background-position: center top;
    background-color: var(--boss-color);
    box-shadow:
      0 0 0 2px rgba(255, 255, 255, 0.08),
      0 0 0 4px var(--boss-color),
      0 0 24px color-mix(in srgb, var(--boss-color) 50%, transparent),
      0 8px 32px rgba(0, 0, 0, 0.6),
      inset 0 -16px 24px rgba(0, 0, 0, 0.4);
    position: relative;
  }

  .boss-name {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--text);
    margin-bottom: 4px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
  }

  .boss-resp {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── CHANNEL RING (6 buttons in a circle) ────────────── */
  .ch-ring {
    position: relative;
    width: 220px;
    height: 220px;
    margin: 0 auto 28px;
  }

  .ch-ring::before {
    content: '';
    position: absolute;
    inset: 30px;
    border: 1px dashed var(--border);
    border-radius: 50%;
    pointer-events: none;
  }

  .ch-btn {
    position: absolute;
    width: 52px;
    height: 52px;
    margin: -26px 0 0 -26px;
    border-radius: 50%;
    background: rgba(22, 22, 22, 0.92);
    backdrop-filter: blur(4px);
    border: 1.5px solid var(--border-strong);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  .ch-btn:hover {
    border-color: var(--boss-color, var(--gold));
    color: var(--text);
    box-shadow: 0 0 16px color-mix(in srgb, var(--boss-color, var(--gold)) 30%, transparent);
    transform: scale(1.08);
  }

  .ch-btn:active { transform: scale(0.96); }

  .ch-btn.disabled {
    cursor: not-allowed;
    opacity: 0.35;
  }
  .ch-btn.disabled:hover {
    border-color: var(--border-strong);
    color: var(--text-dim);
    box-shadow: none;
    transform: none;
  }

  .ch-btn .count {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--boss-color, var(--gold));
    color: #000;
    font-size: 10px;
    font-weight: 700;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
  }

  /* ── INLINE TIMER LIST (per boss) ────────────────────── */
  .boss-timers {
    border-top: 1px solid var(--border);
    padding-top: 16px;
    min-height: 24px;
  }

  .boss-timers-empty {
    text-align: center;
    color: var(--text-faint);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 8px 0;
  }

  /* ── GLOBAL TIMER FEED ───────────────────────────────── */
  .feed-section {
    max-width: 1280px;
    margin: 0 auto;
  }

  .feed-title {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .feed-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .feed {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  .feed-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 48px 16px;
    color: var(--text-faint);
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* ── TIMER CARD ──────────────────────────────────────── */
  .timer {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--boss-color, var(--gold));
    border-radius: 6px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.25s;
    position: relative;
  }

  .timer:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-strong);
  }

  .timer.warn {
    border-color: var(--amber);
    border-left-color: var(--amber);
    background: linear-gradient(90deg, rgba(245, 158, 11, 0.08), var(--bg-card) 40%);
  }

  .timer.critical {
    border-color: var(--red);
    border-left-color: var(--red);
    background: linear-gradient(90deg, rgba(239, 68, 68, 0.12), var(--bg-card) 40%);
    animation: pulseCritical 1.2s ease-in-out infinite;
  }

  .timer.respawn {
    border-color: var(--red);
    border-left-color: var(--red);
    background: linear-gradient(90deg, rgba(239, 68, 68, 0.18), var(--bg-card) 50%);
    box-shadow: 0 0 24px var(--red-glow);
    animation: pulseRespawn 0.8s ease-in-out infinite;
  }

  @keyframes pulseCritical {
    0%, 100% { box-shadow: 0 0 0 transparent; }
    50% { box-shadow: 0 0 16px rgba(239, 68, 68, 0.3); }
  }

  @keyframes pulseRespawn {
    0%, 100% { box-shadow: 0 0 24px var(--red-glow); }
    50% { box-shadow: 0 0 36px rgba(239, 68, 68, 0.7); }
  }

  .timer-mini-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background-image: var(--boss-image);
    background-size: cover;
    background-position: center top;
    background-color: var(--boss-color);
    flex-shrink: 0;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.06),
      0 0 0 2px var(--boss-color),
      0 2px 8px rgba(0, 0, 0, 0.5);
  }

  .timer-info {
    flex: 1;
    min-width: 0;
  }

  .timer-line1 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 2px;
  }

  .timer-ch {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: #000;
    background: var(--boss-color);
    padding: 2px 7px;
    border-radius: 3px;
    letter-spacing: 0.05em;
  }

  .timer-boss {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .timer-countdown {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .timer.warn .timer-countdown { color: var(--amber); }
  .timer.critical .timer-countdown { color: var(--red); }
  .timer.respawn .timer-countdown { color: var(--red); }

  .timer-close {
    background: transparent;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    padding: 6px;
    border-radius: 4px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }

  .timer-close:hover {
    color: var(--red);
    background: rgba(239, 68, 68, 0.1);
  }

  .timer-close svg { width: 14px; height: 14px; }

  /* Compact variant inside boss-card */
  .boss-timers .timer {
    padding: 8px 10px;
    margin-bottom: 6px;
    background: rgba(22, 22, 22, 0.85);
    backdrop-filter: blur(4px);
  }
  .boss-timers .timer:last-child { margin-bottom: 0; }
  .boss-timers .timer-mini-avatar { display: none; }
  .boss-timers .timer-boss { display: none; }
  .boss-timers .timer-countdown { font-size: 15px; }

  /* ── LOADING & SETUP ─────────────────────────────────── */
  .setup-warning {
    max-width: 720px;
    margin: 80px auto;
    padding: 32px;
    background: var(--bg-card);
    border: 1px solid var(--amber);
    border-radius: 12px;
    text-align: center;
  }
  .setup-warning h2 {
    font-family: 'Cinzel', serif;
    color: var(--amber);
    margin-bottom: 12px;
  }
  .setup-warning p {
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 8px;
  }
  .setup-warning code {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 3px;
    color: var(--gold);
    font-size: 12px;
  }

  /* fade-in */
  .boss-card { animation: fadeUp 0.6s ease-out backwards; }
  .boss-card:nth-child(1) { animation-delay: 0.05s; }
  .boss-card:nth-child(2) { animation-delay: 0.15s; }
  .boss-card:nth-child(3) { animation-delay: 0.25s; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .timer { animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>

<header>
  <div class="title-group">
    <h1>Świątynia Hwang</h1>
    <div class="subtitle">Boss Respawn Tracker</div>
  </div>

    <button class="notif-btn" id="notifBtn">Powiadomienia: off</button>

    respMs: 40 * 60 * 1000,
    color: '#7c3aed',
    image: IMG_OSTRZOWIEC
  },
  'przywolywacz': {
    name: 'Ezoteryczny Przywoływacz',
    respMs: 75 * 60 * 1000,    // 1h 15min
    color: '#0ea5e9',
    image: IMG_PRZYWOLYWACZ
  }
};

const POST_RESP_LINGER_MS = 5 * 60 * 1000;
const WARN_THRESHOLD_MS   = 5 * 60 * 1000;
const CRIT_THRESHOLD_MS   = 1 * 60 * 1000;

let db = null;
let timersState = {};
let notifiedAtZero = new Set();
let beepCtx = null;

(function init() {
  if (firebaseConfig.apiKey === "WKLEJ_TUTAJ") {
    document.body.innerHTML = `
      <div class="setup-warning">
        <h2>⚙ Konfiguracja Firebase wymagana</h2>
        <p>Otwórz plik <code>index.html</code> w edytorze i wklej swój config.</p>
      </div>`;
    return;
  }

  try {
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    renderBosses();
    subscribe();
    setInterval(tick, 250);
  } catch (e) {
    console.error(e);
    setConnStatus('error', 'Błąd konfiguracji');
  }
})();

function renderBosses() {
  const grid = document.getElementById('bossesGrid');
  grid.innerHTML = '';

  Object.entries(BOSSES).forEach(([key, boss]) => {
    const card = document.createElement('div');
    card.className = 'boss-card';
    card.style.setProperty('--boss-color', boss.color);
    card.style.setProperty('--boss-image', `url("${boss.image}")`);

    const disabled = boss.respMs == null;
    const respLabel = disabled ? 'CZAS RESPU: ?' : `RESP: ${Math.round(boss.respMs / 60000)} MIN`;

    card.innerHTML = `
      <div class="boss-header">
        <div class="boss-avatar"></div>
        <div class="boss-name">${boss.name}</div>
        <div class="boss-resp">${respLabel}</div>
      </div>
      <div class="ch-ring" data-boss="${key}"></div>
      <div class="boss-timers" data-boss-timers="${key}"></div>
    `;

    const ring = card.querySelector('.ch-ring');
    for (let i = 1; i <= 6; i++) {
      const angle = (i - 1) * 60 - 90;
      const rad = angle * Math.PI / 180;
      const r = 80;
      const cx = 110 + Math.cos(rad) * r;
      const cy = 110 + Math.sin(rad) * r;

      const btn = document.createElement('button');
      btn.className = 'ch-btn' + (disabled ? ' disabled' : '');
      btn.style.left = cx + 'px';
      btn.style.top = cy + 'px';
      btn.dataset.boss = key;
      btn.dataset.channel = i;
      btn.innerHTML = `CH${i}<span class="count" data-count style="display:none">0</span>`;
      if (!disabled) btn.addEventListener('click', () => startTimer(key, i));
      ring.appendChild(btn);
    }

    grid.appendChild(card);
  });
}

function subscribe() {
  setConnStatus('connecting', 'Łączenie...');
  const r = ref(db, 'timers');

  const connRef = ref(db, '.info/connected');
  onValue(connRef, snap => {
    if (snap.val() === true) setConnStatus('online', 'Online');
    else setConnStatus('offline', 'Offline');
  });

  onValue(r, snapshot => {
    timersState = snapshot.val() || {};
    render();
  }, err => {
    console.error(err);
    setConnStatus('error', 'Błąd: ' + err.code);
  });
}

function startTimer(bossKey, channel) {
  const boss = BOSSES[bossKey];
  if (!boss || boss.respMs == null) return;
  const data = {
    boss: bossKey,
    channel: channel,
    startedAt: Date.now(),
    duration: boss.respMs
  };
  push(ref(db, 'timers'), data).catch(err => {
    console.error('startTimer failed', err);
    alert('Nie udało się zapisać timera: ' + err.message);
  });
}

function deleteTimer(id) {
  remove(ref(db, 'timers/' + id)).catch(err => console.error('delete failed', err));
}

function render() {
  const now = Date.now();

  Object.entries(timersState).forEach(([id, t]) => {
    if (now > t.startedAt + t.duration + POST_RESP_LINGER_MS) {
      deleteTimer(id);
    }
  });

  const counts = {};
  Object.values(timersState).forEach(t => {
    const k = `${t.boss}:${t.channel}`;
    counts[k] = (counts[k] || 0) + 1;
  });

  document.querySelectorAll('.ch-btn').forEach(btn => {
    const k = `${btn.dataset.boss}:${btn.dataset.channel}`;
    const badge = btn.querySelector('[data-count]');
    if (counts[k]) {
      badge.textContent = counts[k];
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }
  });

  const sorted = Object.entries(timersState).map(([id, t]) => {
    const elapsed = now - t.startedAt;
    const remaining = t.duration - elapsed;
    return { id, ...t, remaining };
  }).sort((a, b) => a.remaining - b.remaining);

  const feed = document.getElementById('feed');
  const feedCount = document.getElementById('feedCount');
  feedCount.textContent = sorted.length;

  if (sorted.length === 0) {
    feed.innerHTML = '<div class="feed-empty">Kliknij kanał aby wystartować timer</div>';
  } else {
    feed.innerHTML = '';
    sorted.forEach(t => feed.appendChild(buildTimerNode(t, false)));
  }

  Object.keys(BOSSES).forEach(bossKey => {
    const container = document.querySelector(`[data-boss-timers="${bossKey}"]`);
    if (!container) return;
    const own = sorted.filter(t => t.boss === bossKey);
    if (own.length === 0) {
      container.innerHTML = '<div class="boss-timers-empty">— brak —</div>';
    } else {
      container.innerHTML = '';
      own.forEach(t => container.appendChild(buildTimerNode(t, true)));
    }
  });
}

function buildTimerNode(t, compact) {
  const boss = BOSSES[t.boss];
  const node = document.createElement('div');
  node.className = 'timer';
  node.style.setProperty('--boss-color', boss.color);
  node.style.setProperty('--boss-image', `url("${boss.image}")`);
  node.dataset.id = t.id;
  node.dataset.boss = t.boss;
  node.dataset.startedAt = t.startedAt;
  node.dataset.duration = t.duration;

  node.innerHTML = `
    <div class="timer-mini-avatar"></div>
    <div class="timer-info">
      <div class="timer-line1">
        <span class="timer-ch">CH${t.channel}</span>
        <span class="timer-boss">${boss.name}</span>
      </div>
      <div class="timer-countdown" data-countdown>--:--</div>
    </div>
    <button class="timer-close" title="Usuń timer">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 3 L13 13 M13 3 L3 13"/>
      </svg>
    </button>
  `;

  node.querySelector('.timer-close').addEventListener('click', (e) => {
    e.stopPropagation();
    deleteTimer(t.id);
  });

  return node;
}

function tick() {
  const now = Date.now();
  let anyRespawnNow = false;

  document.querySelectorAll('.timer').forEach(el => {
    const id = el.dataset.id;
    const startedAt = +el.dataset.startedAt;
    const duration = +el.dataset.duration;
    const elapsed = now - startedAt;
    const remaining = duration - elapsed;
    const cd = el.querySelector('[data-countdown]');

    el.classList.remove('warn', 'critical', 'respawn');

    if (remaining > WARN_THRESHOLD_MS) {
      cd.textContent = fmt(remaining);
    } else if (remaining > CRIT_THRESHOLD_MS) {
      cd.textContent = fmt(remaining);
      el.classList.add('warn');
    } else if (remaining > 0) {
      cd.textContent = fmt(remaining);
      el.classList.add('critical');
    } else if (-remaining < POST_RESP_LINGER_MS) {
      cd.textContent = 'RESP +' + fmt(-remaining);
      el.classList.add('respawn');
      anyRespawnNow = true;

      if (!notifiedAtZero.has(id)) {
        notifiedAtZero.add(id);
        beep();
        notify(el);
      }
    } else {
      cd.textContent = '—';
    }
  });

  document.title = anyRespawnNow
    ? '🔴 RESP! — Świątynia Hwang'
    : 'Świątynia Hwang — Timery Bossów';
}

function fmt(ms) {
  if (ms < 0) ms = 0;
  const total = Math.ceil(ms / 1000);
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function setConnStatus(state, text) {
  const dot = document.getElementById('connDot');
  const txt = document.getElementById('connText');
  dot.classList.remove('online', 'error');
  if (state === 'online') dot.classList.add('online');
  else if (state === 'error') dot.classList.add('error');
  txt.textContent = text;
}

function notify(el) {
  const bossKey = el.dataset.boss;
  const boss = BOSSES[bossKey];
  const ch = el.querySelector('.timer-ch')?.textContent || '';
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('Resp!', { body: `${boss.name} — ${ch}`, silent: false });
  }
}

function beep() {
  try {
    if (!beepCtx) beepCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = beepCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  } catch (e) {}
}

document.getElementById('notifBtn').addEventListener('click', async () => {
  const btn = document.getElementById('notifBtn');
  if (!('Notification' in window)) { btn.textContent = 'Brak wsparcia'; return; }
  if (Notification.permission === 'granted') {
    btn.textContent = 'Powiadomienia: on';
    btn.classList.add('granted');
    return;
  }
  const result = await Notification.requestPermission();
  if (result === 'granted') {
    btn.textContent = 'Powiadomienia: on';
    btn.classList.add('granted');
  } else {
    btn.textContent = 'Powiadomienia: odrzucone';
  }
});

if ('Notification' in window && Notification.permission === 'granted') {
  const b = document.getElementById('notifBtn');
  b.textContent = 'Powiadomienia: on';
  b.classList.add('granted');
}
</script>

</body>
