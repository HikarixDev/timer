<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Świątynia Hwang — Timery Bossów</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="title-group">
      <h1>Świątynia Hwang</h1>
      <div class="subtitle">Boss Respawn Tracker</div>
    </div>
    <div class="status-row">
      <button class="notif-btn" id="voiceBtn">Głos: off</button>
      <button class="notif-btn" id="notifBtn">Powiadomienia: off</button>
      <span id="connText">Łączenie...</span>
      <span class="conn-dot" id="connDot"></span>
    </div>
  </header>

  <!-- Karty bossów: awatar, kółka CH1-CH6, lista timerów per boss -->
  <section class="bosses" id="bossesGrid"></section>

  <!-- Sekcja: lewa = mapa sightingów, prawa = aktywne timery -->
  <section class="lower-grid">

    <div class="map-panel">
      <div class="panel-title">
        <span>Mapa sightingów</span>
        <span class="panel-count" id="sightingsCount">0</span>
      </div>

      <div class="map-wrap">
        <div class="map" id="map">
          <!-- Markery dodawane dynamicznie. Klik na puste miejsce = popup wyboru bossa -->
          <div class="map-coords" id="mapCoords" hidden></div>
        </div>
        <div class="map-picker" id="mapPicker" hidden>
          <div class="map-picker-label">Który boss?</div>
          <div class="map-picker-buttons" id="mapPickerBtns"></div>
        </div>
        <div class="cal-popup" id="calPopup" hidden>
          <div class="map-picker-label">Koordy tego punktu (x, y)</div>
          <form class="cal-popup-form" id="calPopupForm">
            <input type="text" id="calPopupInput" class="coord-input" placeholder="np. 934, 306" inputmode="numeric" autocomplete="off">
            <button type="submit" class="coord-btn">OK</button>
          </form>
        </div>
      </div>

      <div class="map-legend" id="mapLegend"></div>

      <div class="coord-bar">
        <form class="coord-form" id="coordForm">
          <input type="text" id="coordInput" class="coord-input" placeholder="Wpisz koordy: 934, 306" inputmode="numeric" autocomplete="off">
          <button type="submit" class="coord-btn" id="coordGo">Dodaj</button>
        </form>
        <button type="button" class="cal-btn" id="calBtn">Kalibruj</button>
      </div>

      <div class="coord-status" id="coordStatus"></div>

      <div class="map-hint" id="mapHint">Kliknij na mapę aby dodać znacznik. Kliknij znacznik aby usunąć. Kliknij bossa w legendzie aby ukryć/pokazać.</div>
    </div>

    <div class="feed-panel">
      <div class="panel-title">
        <span>Aktywne odliczania</span>
        <span class="panel-count" id="feedCount">0</span>
      </div>
      <div class="feed" id="feed">
        <div class="feed-empty">Kliknij kanał aby wystartować timer</div>
      </div>
    </div>

  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
