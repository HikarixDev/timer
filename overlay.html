<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Hwang Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c9a961; --gold-bright: #e6c688;
      --text: #ececec; --text-dim: #8a8a8a;
      --green: #4ade80; --amber: #f59e0b; --red: #ef4444;
      --panel: rgba(12, 12, 12, 0.82);
      --border: rgba(201, 169, 97, 0.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      user-select: none;
      overflow: hidden;
    }
    .hud {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.55);
      overflow: hidden;
    }

    /* Pasek tytułu — chwyt do przeciągania okna (gdy tryb klikalny). */
    .bar {
      -webkit-app-region: drag;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }
    .bar .title { font-family: 'Cinzel', serif; color: var(--gold-bright); letter-spacing: 0.06em; }
    .bar .active {
      flex: 1; min-width: 0;
      color: var(--gold); font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .bar .dot { width: 7px; height: 7px; border-radius: 50%; background: #555; }
    .bar .dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .bar .mode { font-size: 9px; color: var(--text-dim); -webkit-app-region: no-drag; }
    .bar .mode.live { color: var(--green); }

    /* Przyciski kanałów aktywnego bossa. */
    .chans {
      -webkit-app-region: no-drag;
      display: grid; grid-template-columns: repeat(6, 1fr);
      gap: 4px; padding: 8px;
    }
    .chans button {
      -webkit-app-region: no-drag;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
      color: var(--gold); background: rgba(201,169,97,0.08);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 0; cursor: pointer; transition: background .12s;
    }
    .chans button:hover { background: rgba(201,169,97,0.22); }
    .chans button:active { transform: translateY(1px); }

    /* Lista odliczań. */
    .list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; }
    .list::-webkit-scrollbar { width: 6px; }
    .list::-webkit-scrollbar-thumb { background: rgba(201,169,97,0.3); border-radius: 3px; }
    .row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; margin-bottom: 4px;
      border-radius: 6px;
      background: rgba(255,255,255,0.03);
      border-left: 3px solid var(--rc, var(--gold));
    }
    .row .ch { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; color: var(--text-dim); }
    .row .nm { flex: 1; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .cd { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; }
    .row .x {
      -webkit-app-region: no-drag;
      width: 16px; height: 16px; line-height: 14px; text-align: center;
      border: none; border-radius: 4px; cursor: pointer;
      color: var(--text-dim); background: transparent; font-size: 14px;
    }
    .row .x:hover { color: var(--red); background: rgba(239,68,68,0.12); }
    .row.warn { border-left-color: var(--amber); }
    .row.warn .cd { color: var(--amber); }
    .row.critical { border-left-color: var(--red); }
    .row.critical .cd { color: var(--red); }
    .row.respawn { border-left-color: var(--green); background: rgba(74,222,128,0.1); }
    .row.respawn .cd { color: var(--green); }
    .empty { text-align: center; color: var(--text-dim); font-size: 11px; padding: 18px 0; }

    .hint {
      padding: 6px 8px; border-top: 1px solid var(--border);
      font-size: 9px; color: var(--text-dim); text-align: center;
      letter-spacing: 0.02em;
    }
    .voice {
      -webkit-app-region: no-drag;
      cursor: pointer; color: var(--gold);
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="bar">
      <span class="title">HWANG</span>
      <span class="active" id="activeBoss">—</span>
      <span class="dot" id="dot"></span>
      <span class="mode" id="mode">klik-przez</span>
    </div>
    <div class="chans" id="chans"></div>
    <div class="list" id="list"><div class="empty">Brak aktywnych timerów</div></div>
    <div class="hint">
      Ctrl+Alt+<b>1–6</b> start · <b>B</b> boss · <b>X</b> klik · <b>H</b> ukryj ·
      <span class="voice" id="voiceToggle">głos: off</span>
    </div>
  </div>
  <script type="module" src="overlay.js"></script>
</body>
</html>
